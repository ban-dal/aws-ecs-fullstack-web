# preprod 브랜치의 모든 push는 즉시 배포한다. prod는 main에서 수동 실행하고
# prod-deploy 환경 승인을 받은 뒤 빌드·이미지 push·ECS 갱신을 한 작업에서 수행한다.
name: Deploy app

on:
  push:
    branches: [preprod]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: app-deploy-${{ github.event_name == 'workflow_dispatch' && 'prod' || 'preprod' }}
  cancel-in-progress: false

jobs:
  preprod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preprod'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aws-fullstack-lab-app-preprod
          aws-region: ${{ env.AWS_REGION }}
      - run: scripts/build-push-deploy.sh preprod

  prod:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: prod-deploy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aws-fullstack-lab-app-prod
          aws-region: ${{ env.AWS_REGION }}
      - run: scripts/build-push-deploy.sh prod
