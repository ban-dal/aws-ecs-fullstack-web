# 두 브랜치의 push가 각각 해당 환경의 배포를 시작한다.
# prod-deploy 환경은 main만 허용하고 배포 전 승인을 요구한다.
name: Deploy app

on:
  push:
    branches: [preprod, main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

defaults:
  run:
    shell: bash

concurrency:
  group: app-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preprod:
    if: github.ref == 'refs/heads/preprod'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aws-fullstack-lab-app-preprod
          aws-region: ${{ env.AWS_REGION }}
      - run: scripts/build-push-deploy.sh preprod

  prod:
    if: github.ref == 'refs/heads/main'
    environment: prod-deploy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aws-fullstack-lab-app-prod
          aws-region: ${{ env.AWS_REGION }}
      - run: scripts/build-push-deploy.sh prod
