name: App CI

on:
  pull_request:
    branches: [main, preprod]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build and check container health
        shell: bash
        run: |
          docker build --platform linux/arm64 -f apps/web/Dockerfile -t web:ci .
          docker run -d --name web-ci -p 3000:3000 -e APP_ENV=ci web:ci
          trap 'docker rm -f web-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null)"; then
              jq -e '.status == "ok"' <<<"$body" >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs web-ci
          exit 1
